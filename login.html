<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Pedidos</title>
    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="css/legal.css">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background-color: #121212;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            overflow-y: auto;
        }

        .main-wrapper {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 100%;
            background-color: #121212;
        }

        /* Glass Card */
        .login-card {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 400px;
            border-radius: 30px;
            background: linear-gradient(to right, rgba(255, 255, 255, 0.1), #121212);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        .logo-container img {
            width: 24px;
            height: 24px;
        }

        .title {
            font-size: 1.5rem;
            font-weight: 600;
            color: white;
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .form-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            gap: 1rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .input-field {
            width: 100%;
            padding: 0.75rem 1.25rem;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid transparent;
            color: white;
            font-size: 0.875rem;
            outline: none;
            transition: all 0.2s ease;
            box-sizing: border-box;
        }

        .input-field::placeholder {
            color: #d1d5db;
        }

        .input-field:focus {
            border-color: #9ca3af;
            box-shadow: 0 0 0 2px rgba(156, 163, 165, 0.2);
        }
        .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
        :focus-visible { outline:3px solid #60a5fa !important; outline-offset:3px; }

        .error-msg {
            color: #f87171;
            font-size: 0.875rem;
            text-align: left;
            margin-top: 0.25rem;
        }

        .separator {
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
            margin: 0.5rem 0;
            border: none;
        }

        .btn-signin {
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-weight: 500;
            padding: 0.75rem 1.25rem;
            border-radius: 9999px;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.875rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .btn-signin:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .btn-google {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: linear-gradient(to bottom, #232526, #2d2e30);
            color: white;
            font-weight: 500;
            padding: 0.75rem 1.25rem;
            border-radius: 9999px;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.875rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 0.5rem;
        }

        .btn-google:hover {
            filter: brightness(1.1);
        }

        .btn-google img {
            width: 20px;
            height: 20px;
        }

        .signup-text {
            text-align: center;
            margin-top: 0.5rem;
            font-size: 0.75rem;
            color: #9ca3af;
        }

        .signup-text a {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: underline;
            transition: color 0.2s ease;
        }

        .signup-text a:hover {
            color: white;
        }

        .social-proof {
            position: relative;
            z-index: 10;
            margin-top: 3rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .social-proof p {
            color: #9ca3af;
            font-size: 0.875rem;
            margin-bottom: 0.5rem;
        }

        .social-proof span {
            color: white;
            font-weight: 500;
        }

        .avatars {
            display: flex;
        }

        .avatars img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid #181824;
            object-fit: cover;
            margin-left: -8px;
        }

        .avatars img:first-child {
            margin-left: 0;
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <div class="login-card">
            <div class="logo-container">
                <span aria-hidden="true" style="font-weight:800;color:#fff">SP</span>
            </div>
            <h2 class="title">Sistema de Pedidos</h2>

            <div class="form-container">
                <div class="input-group">
                    <label class="sr-only" for="email">E-mail</label>
                    <input id="email" type="email" autocomplete="email" placeholder="E-mail" class="input-field">
                    <label class="sr-only" for="password">Senha</label>
                    <input id="password" type="password" autocomplete="current-password" placeholder="Senha" class="input-field">
                    <div id="error-msg" class="error-msg" style="display: none;"></div>
                </div>

                <hr class="separator">

                <div class="button-group">
                    <button id="btnSignIn" class="btn-signin">Entrar</button>
                    <button id="btnGoogleLogin" class="btn-google">
                        <span aria-hidden="true">G</span>
                        Continuar com Google
                    </button>
                    <div class="signup-text">
                        Não tem uma conta? <a href="#" id="btnSignUp">Cadastre-se grátis!</a><br><small>O cadastro usa seu e-mail e credencial para criar e proteger sua conta. Leia os <a href="termos.html">termos de uso</a> e a <a href="privacidade.html">política de privacidade</a>. Documentos em rascunho até confirmação dos dados do fornecedor.</small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <script src="js/firebase-init.js"></script>
    <script src="js/auth-service.js"></script>
    <script src="js/legal-ui.js"></script>
    <script>
        // Login com Google
        document.getElementById('btnGoogleLogin').addEventListener('click', () => {
            AuthService.loginWithGoogle();
        });

        // Login Tradicional (Email/Senha)
        document.getElementById('btnSignIn').addEventListener('click', async () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error-msg');

            if (!email || !password) {
                errorDiv.innerText = "Por favor, preencha email e senha.";
                errorDiv.style.display = "block";
                return;
            }

            errorDiv.style.display = "none";
            try {
                await AuthService.loginWithEmail(email, password);
            } catch (error) {
                errorDiv.innerText = "Email ou senha incorretos.";
                errorDiv.style.display = "block";
            }
        });

        document.getElementById('btnSignUp').addEventListener('click', async (event) => {
            event.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error-msg');
            if (!email || !password) {
                errorDiv.innerText = "Preencha email e senha para criar sua conta.";
                errorDiv.style.display = "block";
                return;
            }
            if (password.length < 6) {
                errorDiv.innerText = "A senha precisa ter pelo menos 6 caracteres.";
                errorDiv.style.display = "block";
                return;
            }
            errorDiv.style.display = "none";
            try {
                await AuthService.registerWithEmail(email, password);
            } catch (error) {
                errorDiv.innerText = error.code === 'auth/email-already-in-use'
                    ? "Esse email já possui uma conta. Entre com sua senha."
                    : "Não foi possível criar a conta. Confira o email e tente outra senha.";
                errorDiv.style.display = "block";
            }
        });
    </script>
</body>
</html>
